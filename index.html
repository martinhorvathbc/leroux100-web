<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LEROUX100 – 1927 · 2027</title>
<meta name="description" content="LEROUX100 – the centenary of Gaston Leroux, author of The Phantom of the Opera. Launching 1 December 2026.">
<style>
:root{--bg:#07060a;--ink:#f3ece0;--gold:#cfa968;--mute:#8d867c}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 40%,#1a1220 0%,var(--bg) 70%);color:var(--ink);font-family:Georgia,"Times New Roman",serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px 16px}
main{max-width:900px;width:100%}
.eb{font:500 12px/1.6 Arial,sans-serif;letter-spacing:.42em;color:var(--gold);text-transform:uppercase}
h1{font-weight:400;font-size:clamp(44px,12vw,112px);letter-spacing:.03em;font-variant-numeric:lining-nums;margin:.2em 0 .1em;line-height:1}
.y{font-size:clamp(20px,4vw,30px);color:var(--gold);font-style:italic}
.l{width:64px;height:1px;background:var(--gold);margin:32px auto;opacity:.7}
p{font-size:clamp(17px,2.6vw,21px);line-height:1.6;margin:.4em 0}
.s{color:var(--mute);font-size:16px}
.go{font-size:clamp(19px,3.4vw,26px);color:var(--gold);margin:30px 0 0}
.cd{display:flex;justify-content:center;gap:clamp(6px,2.5vw,28px);margin:28px 0 8px}
.u{min-width:clamp(48px,14vw,110px)}
.n{font-size:clamp(34px,9vw,72px);line-height:1;font-variant-numeric:lining-nums tabular-nums}
.t{font:500 11px/1 Arial,sans-serif;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;margin-top:10px}
.sep{font-size:clamp(30px,7vw,56px);color:var(--gold);opacity:.5;line-height:1.1}
a{color:var(--gold);text-decoration:none;border-bottom:1px solid rgba(207,169,104,.4)}
footer{margin-top:40px;font:400 13px/1.8 Arial,sans-serif;color:var(--mute);letter-spacing:.06em}
</style>
</head>
<body>
<main>
<div class="eb">Coming soon · Bientôt · Pripravujeme</div>
<h1>LEROUX100</h1>
<div class="y">15. 4. 1927 – 15. 4. 2027</div>
<div class="l"></div>
<p>The centenary of the author of The Phantom of the Opera.</p>
<p class="go" id="launch">The website launches on 1&nbsp;December&nbsp;2026<br><span class="s">Le site ouvre le 1<sup>er</sup>&nbsp;décembre&nbsp;2026<br>Web spúšťame 1.&nbsp;12.&nbsp;2026</span></p>
<div class="cd" id="cd" aria-live="polite">
  <div class="u"><div class="n" id="d">–</div><div class="t">days</div></div>
  <div class="sep">:</div>
  <div class="u"><div class="n" id="h">–</div><div class="t">hours</div></div>
  <div class="sep">:</div>
  <div class="u"><div class="n" id="m">–</div><div class="t">min</div></div>
  <div class="sep">:</div>
  <div class="u"><div class="n" id="s">–</div><div class="t">sec</div></div>
</div>
<footer><a href="https://www.fantomopery.sk">fantomopery.sk</a></footer>
</main>
<script>
(function(){
  var target = Date.parse("2026-12-01T00:00:00+01:00"); // polnoc SEČ (Bratislava, Paríž)
  var el = {d:document.getElementById("d"),h:document.getElementById("h"),m:document.getElementById("m"),s:document.getElementById("s")};
  function pad(x){return (x<10?"0":"")+x}
  function tick(){
    var left = Math.max(0, Math.floor((target - Date.now())/1000));
    el.d.textContent = Math.floor(left/86400);
    el.h.textContent = pad(Math.floor(left%86400/3600));
    el.m.textContent = pad(Math.floor(left%3600/60));
    el.s.textContent = pad(left%60);
    if (left === 0) { document.getElementById("launch").textContent = "LEROUX100 is live · Le site est en ligne · Web je spustený"; clearInterval(t); }
  }
  var t = setInterval(tick, 1000); tick();
})();
</script>
</body>
</html>
